<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte Multiplataforma · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f8; --text:#151a2d; --muted:#5b6278; --faint:#8a90a6;
  --border:#e2e5ee; --accent:#4f46e5; --accent-strong:#4338ca; --accent-soft:#eef0ff;
  --a:#0f8f84; --a-soft:#e4f5f3; --b:#7c3aed; --b-soft:#f2ecff;
  --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fdf3e2; --err:#c62828; --err-soft:#fdecec;
  --shadow:0 1px 2px rgba(20,25,45,.06),0 4px 16px rgba(20,25,45,.06);
  --radius:14px; --side:236px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1020; --surface:#151a2c; --surface-2:#1c2238; --text:#e8eaf4; --muted:#a3a9be; --faint:#7a809a;
    --border:#2a3150; --accent:#8b85ff; --accent-strong:#a39eff; --accent-soft:#23264a;
    --a:#2cc9b8; --a-soft:#10332f; --b:#a88bfa; --b-soft:#271f45;
    --ok:#4ade80; --ok-soft:#12301d; --warn:#fbbf24; --warn-soft:#352812; --err:#f87171; --err-soft:#3a1818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1020; --surface:#151a2c; --surface-2:#1c2238; --text:#e8eaf4; --muted:#a3a9be; --faint:#7a809a;
  --border:#2a3150; --accent:#8b85ff; --accent-strong:#a39eff; --accent-soft:#23264a;
  --a:#2cc9b8; --a-soft:#10332f; --b:#a88bfa; --b-soft:#271f45;
  --ok:#4ade80; --ok-soft:#12301d; --warn:#fbbf24; --warn-soft:#352812; --err:#f87171; --err-soft:#3a1818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:'JetBrains Mono',monospace}

/* ── Layout ─────────────────────────────── */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
.brand h1{font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow-y:auto}
.nav-sec{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;padding:14px 10px 6px}
.nav button,.nav a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;text-align:left;text-decoration:none}
.nav button:hover,.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent-strong)}
.nav .ico{width:20px;text-align:center;font-size:15px}
.nav .count{margin-left:auto;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.nav .count:empty{display:none}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint)}
.side-foot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface)}
.top h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.top p{font-size:12.5px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.view{flex:1;overflow:auto;padding:22px 26px 40px;min-height:0}
.view.flush{padding:0;overflow:hidden}

/* ── Componentes ───────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-strong);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.a{background:var(--a-soft);color:var(--a)} .tag.b{background:var(--b-soft);color:var(--b)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.err{background:var(--err-soft);color:var(--err)}
.tag.acc{background:var(--accent-soft);color:var(--accent-strong)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
label.f span.hint{font-weight:500;color:var(--faint)}
.inp,select.inp,textarea.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);outline:none;font-size:13.5px;font-weight:500;color:var(--text)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
input[type=color].inp{padding:3px;height:38px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 11px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover td{background:var(--surface-2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cols .c i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols .c span{font-size:10px;color:var(--faint);white-space:nowrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,25,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{flex:1;font-size:15px;font-weight:800}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent-strong)}
.note{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:11px 14px;font-size:12.5px}
.note.warn{background:var(--warn-soft)}
pre.code{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.carregando{padding:40px;text-align:center;color:var(--muted)}

/* login */
.login{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:19px;font-weight:800}
.login p{font-size:13px;color:var(--muted)}
.login .err{color:var(--err);font-size:12.5px;min-height:18px}

/* ── Atendimento (teste do chat real) ──── */
.atd{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;height:100%;min-height:0}
.atd.nodebug{grid-template-columns:270px minmax(0,1fr)}
.atd.nodebug .dbg{display:none}
.atd-l{border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.atd-l h4,.dbg h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;margin-bottom:8px}
.cli-pick{display:flex;flex-direction:column;gap:6px}
.cli-pick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:9px 10px}
.cli-pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.cli-pick .av{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.cli-pick b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.cli-pick small{font-size:11px;color:var(--muted)}
.chat-wrap{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);padding:18px;align-items:center}
.chat-wrap iframe{width:100%;max-width:460px;flex:1;min-height:0;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);background:var(--surface)}
.link-box{display:flex;gap:6px}
.link-box input{flex:1;min-width:0;font-size:11.5px;font-family:'JetBrains Mono',monospace}
.dbg{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.dbg .box{border:1px solid var(--border);border-radius:11px;padding:12px}
.dbg .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.dbg .kv span:first-child{color:var(--muted)}
.dbg .kv b{text-align:right}
.match{margin-top:8px}
.match .mt{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.match .track{height:6px;background:var(--surface-2);border-radius:4px;margin-top:4px;overflow:hidden}
.match .fill{height:100%;background:var(--accent)}
.match .fill.hi{background:var(--ok)} .match .fill.md{background:var(--warn)} .match .fill.lo{background:var(--err)}
.dbg-x{display:none;align-self:flex-end}
.tokens{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tokens span{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface-2);border-radius:5px;padding:1px 6px}

/* ── Fila / Base / Kits ────────────────── */
.q-item{padding:16px 18px;border-bottom:1px solid var(--border)}
.q-item:last-child{border-bottom:none}
.q-item .q{font-size:14.5px;font-weight:700}
.q-item .vars{font-size:12px;color:var(--muted);margin-top:4px}
.q-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.q-resolve{margin-top:12px;display:none;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:11px;padding:12px}
.q-resolve.show{display:flex}
.kit-card .card-b{display:flex;flex-direction:column;gap:12px}
.kit-ico{font-size:30px}
.kit-card ul{padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.plan{padding:18px;display:flex;flex-direction:column;gap:10px}
.plan .tag{align-self:flex-start}
.plan .price{font-size:24px;font-weight:800;letter-spacing:-.5px}
.plan .price small{font-size:12px;font-weight:600;color:var(--muted)}
.cmp th:first-child,.cmp td:first-child{font-weight:700;color:var(--muted);width:150px}
.cmp td{font-size:13px}
.cli-card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cli-card .hd{display:flex;gap:12px;align-items:center}
.cli-card .av{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;flex-shrink:0}
.cli-card h3{font-size:15px;font-weight:800}
.var-chip{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px dashed var(--border);border-radius:6px;padding:2px 7px;background:var(--surface);color:var(--muted)}
.var-chip:hover{border-color:var(--accent);color:var(--accent-strong)}

@media (max-width:1180px){
  .atd,.atd.nodebug{grid-template-columns:250px minmax(0,1fr)}
  .atd .dbg{display:none}
  .atd.dbg-open .dbg{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(320px,90vw);z-index:40;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .dbg-x{display:inline-flex}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .side{border-right:none;border-bottom:1px solid var(--border)}
  .brand{padding:12px 16px 4px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 10px 10px;flex:none}
  .nav-sec,.side-foot{display:none}
  .nav button,.nav a{width:auto;white-space:nowrap}
  .top{padding:14px 16px;flex-wrap:wrap}
  .view{padding:16px 16px 40px;overflow:visible}
  .view.flush{overflow:visible}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .atd,.atd.nodebug{grid-template-columns:1fr;height:auto}
  .atd-l{border-right:none;border-bottom:1px solid var(--border)}
  .cli-pick{flex-direction:row;overflow-x:auto}
  .cli-pick button{min-width:190px}
  .chat-wrap{padding:12px;height:80vh}
  .bar{grid-template-columns:100px 1fr 40px}
}
</style>
</head>
<body>
<div id="raiz"><div class="carregando">Carregando…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="kits.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   ESTADO — carregado do Supabase
   ═══════════════════════════════════════════════════════════════ */
const CFG = window.SM_CONFIG || {};
const THEME_KEY = 'sm_tema';
const clone = o => JSON.parse(JSON.stringify(o));
const PRECOS_PADRAO = { A_proprio:{setup:290,mensal:149}, A_criado:{setup:690,mensal:199}, B_proprio:{setup:490,mensal:299}, B_criado:{setup:990,mensal:379}, descontoPiloto:50 };
let sb = null, eu = null;
const S = { empresas:[], base:{}, fila:[], kits:{}, ajustes:{ limiar:0.45, precos:clone(PRECOS_PADRAO) }, acessos:[] };
const ui = { view:'atendimento', empresaAtiva:null, debug:innerWidth>1180, ultimaAnalise:null, baseEmpresa:null, baseBusca:'', filaEmpresa:'', relEmpresa:'', relPeriodo:30, propEmpresa:null, kitAberto:null, iaStatus:null };

function must(r){ if (r.error) throw r.error; return r.data; }
// Supabase devolve no máximo 1000 linhas por consulta: esta função busca página por página
async function paginar(fabrica, limite = 50000){
  const out = [];
  for (let de = 0; de < limite; de += 1000) { const d = must(await fabrica().range(de, de + 999)); out.push(...d); if (d.length < 1000) break; }
  return out;
}
async function carregarTudo(){
  const [emps, resps, kits, aj, acs] = await Promise.all([
    sb.from('empresas').select('*').order('criado_em').then(must),
    paginar(() => sb.from('respostas').select('*').order('id')),
    sb.from('kits').select('*').then(must),
    sb.from('ajustes').select('*').eq('id', 1).maybeSingle().then(must),
    sb.from('perfis').select('*').eq('papel', 'empresa').then(must),
  ]);
  S.empresas = emps; S.base = {};
  emps.forEach(e => S.base[e.id] = []);
  resps.forEach(r => (S.base[r.empresa_id] || (S.base[r.empresa_id] = [])).push(r));
  S.kits = Object.fromEntries(kits.map(k => [k.id, k.dados]));
  if (!kits.length) await instalarKits();
  if (aj) S.ajustes = { limiar: aj.limiar, precos: { ...clone(PRECOS_PADRAO), ...(aj.precos || {}) } };
  S.acessos = acs;
  await recarregarFila();
  if (!emp(ui.empresaAtiva)) ui.empresaAtiva = S.empresas[0]?.id || null;
}
async function recarregarFila(){
  const desde = new Date(Date.now() - 30 * 864e5).toISOString();
  const [pend, feitas] = await Promise.all([
    paginar(() => sb.from('fila').select('*').eq('status', 'pendente').order('id')),
    sb.from('fila').select('*').neq('status', 'pendente').gte('resolvido_em', desde).order('resolvido_em', { ascending: false }).limit(50).then(must),
  ]);
  S.fila = [...pend, ...feitas]; atualizarBadges();
}
async function instalarKits(){
  const rows = Object.values(KITS_PADRAO).map(k => ({ id: k.id, dados: k, atualizado_em: new Date().toISOString() }));
  must(await sb.from('kits').upsert(rows));
  S.kits = clone(KITS_PADRAO);
}
function respostasDoKit(kitId, empresaId){
  return (S.kits[kitId]?.entradas || []).map(e => ({ empresa_id: empresaId, intencao: e.intencao, categoria: e.categoria, perguntas: [...e.perguntas], resposta: e.resposta, humano: !!e.humano, origem: 'kit' }));
}
function varsExemplo(kitId, sobrescrever = {}){ const v = {}; (S.kits[kitId]?.vars || []).forEach(x => v[x.k] = x.ex); return Object.assign(v, sobrescrever); }

/* ═══════════════════════════════════════════════════════════════
   UTILITÁRIOS
   ═══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
function norm(t){return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function brl(v){return Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dataHora(ts){return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function pct(v){return Math.round(v * 100) + '%'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3000)}
function erro(e){ console.error(e); toast('⚠️ ' + (e?.message || e)); }
const emp = id => S.empresas.find(c => c.id === id);
const kitDe = c => S.kits[c?.nicho] || null;
function resolver(txt, c){return String(txt || '').replace(/\{\{(\w+)\}\}/g, (m, k) => { const v = c?.vars?.[k]; return v && String(v).trim() ? v : '(informação ainda não cadastrada)'; })}
function bdNome(b){return b === 'criado' ? 'BD criado (kit do nicho)' : 'BD próprio'}
function tagPlano(c){return `<span class="tag ${c.plano === 'B' ? 'b' : 'a'}">${c.plano === 'B' ? '✨ Opção B · IA' : '⚙️ Opção A · ML'}</span>`}
function opcoesEmpresas(sel, todos){return (todos ? `<option value="">Todos os clientes</option>` : '') + S.empresas.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
function atualizarBadges(){ const n = S.fila.filter(f => f.status === 'pendente').length; const el = $('#filaCount'); if (el) el.textContent = n || ''; }
function slugDe(t){ return norm(t).replace(/ /g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'empresa'; }
const baseUrl = () => CFG.CHAT_URL ? CFG.CHAT_URL.replace(/\/?$/, '/') : new URL('.', location.href).href;
function linkChat(c){ return `${baseUrl()}index.html?c=${encodeURIComponent(c.slug)}`; }
function codigoWidget(c){ return `<script src="${baseUrl()}widget.js" data-empresa="${c.slug}" data-cor="${c.cor || '#4f46e5'}" async><\/script>`; }
async function copiar(t){ try { await navigator.clipboard.writeText(t); toast('Copiado!'); } catch (e) { prompt('Copie:', t); } }
const GENERICAS = new Set('voces voce qual quais quanto quanta como onde quando tem tenho para pelo pela esse essa isso este esta aqui gostaria queria saber favor fazem vende vendem aceita aceitam pode podem posso'.split(' '));
function sugerirIntencao(p){ return norm(p).split(' ').filter(w => w.length > 3 && !GENERICAS.has(w)).slice(0, 3).join('_') || 'nova_intencao'; }

function abrirModal(titulo, corpo, botoes){
  $('#modal').innerHTML = `<div class="modal-h"><h3>${titulo}</h3><button class="btn ghost sm" data-act="fecharModal">✕</button></div><div class="modal-b">${corpo}</div><div class="modal-f">${botoes || '<button class="btn" data-act="fecharModal">Fechar</button>'}</div>`;

async function ocupado(el, fn){ const txt = el?.innerHTML; if (el) { el.disabled = true; el.innerHTML = '⏳'; } try { return await fn(); } catch (e) { erro(e); } finally { if (el && document.body.contains(el)) { el.disabled = false; el.innerHTML = txt; } } }

async function entrar(){

async function filaAbrir(id, modo){
  const f = S.fila.find(x => x.id === id), box = $('#qr_' + id), c = emp(f.empresa_id);
  document.querySelectorAll('.q-resolve.show').forEach(b => { if (b !== box) { b.classList.remove('show'); b.innerHTML = ''; } });
  box.classList.add('show');
  if (modo === 'vincular') {
    box.innerHTML = `<p class="small muted">Calculando semelhança…</p>`;
    let ord;
    try {
      const r = await smChamar(sb, 'analisar', { empresa_id: f.empresa_id, texto: f.pergunta, n: 3000 });
      const base = S.base[f.empresa_id] || [];
      ord = r.top.map(m => ({ e: base.find(x => x.id === m.id), s: m.score })).filter(o => o.e);
    } catch (e) { box.innerHTML = `<p class="small" style="color:var(--err)">${esc(e.message)}</p>`; return; }
    box.innerHTML = `<label class="f">Qual resposta existente atende essa pergunta?<select class="inp" id="qv_${id}">${ord.map(o => `<option value="${o.e.id}">${esc(o.e.intencao)} (${pct(o.s)}) — ${esc(resolver(o.e.resposta, c).slice(0, 70))}…</option>`).join('')}</select></label>
      <p class="small muted">A pergunta${f.variacoes?.length ? ' e suas variações serão adicionadas' : ' será adicionada'} como nova forma de perguntar — o bot passa a reconhecê-la.</p>
      <div class="row"><button class="btn pri sm" data-act="filaVincularSel" data-id="${id}">Salvar vínculo</button><button class="btn sm ghost" data-act="filaFechar" data-id="${id}">Cancelar</button></div>`;
    return;

/* ── Relatórios (consulta o banco) ─────── */
async function vRelatorios(){
  $('#view').innerHTML = `<div class="row" style="margin-bottom:14px"><select class="inp" style="max-width:260px" data-chg="relEmpresa">${opcoesEmpresas(ui.relEmpresa, true)}</select>
  <div class="seg">${[7,30,90].map(p => `<button class="${ui.relPeriodo === p ? 'on' : ''}" data-act="relPeriodo" data-id="${p}">${p} dias</button>`).join('')}</div></div><div id="relConteudo" class="carregando">Carregando relatórios…</div>`;
  const alvo = ui.view, dias = Math.max(ui.relPeriodo, 14), desde = new Date(Date.now() - dias * 864e5).toISOString();
  let M, C;
  try {
    [M, C] = await Promise.all([
      paginar(() => { let q = sb.from('mensagens').select('id,resultado,intencao,feedback,criado_em,empresa_id,conversas!inner(teste)').eq('autor', 'bot').eq('conversas.teste', false).gte('criado_em', desde).order('id'); return ui.relEmpresa ? q.eq('empresa_id', ui.relEmpresa) : q; }),
      paginar(() => { let q = sb.from('conversas').select('id,empresa_id,status,criado_em').eq('teste', false).not('ultima_mensagem', 'is', null).gte('criado_em', desde).order('id'); return ui.relEmpresa ? q.eq('empresa_id', ui.relEmpresa) : q; }),
    ]);
  } catch (e) { if (ui.view === alvo) $('#relConteudo').innerHTML = `<div class="empty">Erro: ${esc(e.message)}</div>`; return; }
  if (ui.view !== 'relatorios') return;
  const corte = Date.now() - ui.relPeriodo * 864e5;
  const L = M.filter(m => new Date(m.criado_em) >= corte), CV = C.filter(c => new Date(c.criado_em) >= corte);
  const tot = L.length, res = L.filter(l => l.resultado === 'resolvido' || l.resultado === 'saudacao').length, hum = L.filter(l => l.resultado === 'humano').length, fila = L.filter(l => l.resultado === 'fila' || l.resultado === 'sugestao').length;
  const fb = L.filter(l => l.feedback), pos = fb.filter(l => l.feedback === 'pos').length;
  const porInt = {}; L.filter(l => l.intencao && l.resultado !== 'fila').forEach(l => porInt[l.intencao] = (porInt[l.intencao] || 0) + 1);
  const topInt = Object.entries(porInt).sort((a, b) => b[1] - a[1]).slice(0, 8); const mx = topInt[0]?.[1] || 1;
  const serie = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i); const f = d.getTime() + 864e5; serie.push({ lbl: d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), n: M.filter(m => { const t = new Date(m.criado_em).getTime(); return t >= d.getTime() && t < f; }).length }); }
  const md = Math.max(1, ...serie.map(d => d.n));
  const porCli = S.empresas.filter(c => !ui.relEmpresa || c.id === ui.relEmpresa).map(c => { const x = L.filter(l => l.empresa_id === c.id); const r = x.filter(l => l.resultado === 'resolvido' || l.resultado === 'saudacao').length; return { c, n: x.length, conv: CV.filter(v => v.empresa_id === c.id).length, taxa: x.length ? r / x.length : 0, pend: S.fila.filter(f => f.empresa_id === c.id && f.status === 'pendente').length, base: (S.base[c.id] || []).length }; });
  $('#relConteudo').className = '';
  $('#relConteudo').innerHTML = `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">Conversas</div><div class="v">${CV.length}</div><div class="s">${tot} respostas do bot</div></div>
    <div class="card kpi"><div class="l">Resolvidas sozinho</div><div class="v">${tot ? pct(res / tot) : '—'}</div><div class="s">${res} respostas sem ninguém</div></div>
    <div class="card kpi"><div class="l">Encaminhadas</div><div class="v">${hum + fila}</div><div class="s">${hum} p/ humano · ${fila} p/ fila de treino</div></div>
    <div class="card kpi"><div class="l">Aprovação</div><div class="v">${fb.length ? pct(pos / fb.length) : '—'}</div><div class="s">${fb.length} avaliações 👍/👎</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Assuntos mais perguntados</h3></div><div class="card-b">${topInt.length ? `<div class="bars">${topInt.map(([k, v]) => `<div class="bar"><span class="lbl">${esc(k)}</span><div class="track"><div class="fill" style="width:${v / mx * 100}%"></div></div><span class="n">${v}</span></div>`).join('')}</div>` : '<p class="muted small">Sem atendimentos reais no período.</p>'}</div></div>
    <div class="card"><div class="card-h"><h3>Respostas do bot por dia (14 dias)</h3></div><div class="card-b"><div class="cols">${serie.map(d => `<div class="c" title="${d.lbl}: ${d.n}"><i style="height:${d.n / md * 100}%"></i><span>${d.lbl.slice(0, 2)}</span></div>`).join('')}</div></div></div>
  </div>
  <div class="card" style="overflow:auto"><div class="card-h"><h3>Por cliente</h3><span class="muted small" style="margin-left:auto">base para os cases dos pilotos</span></div>
  <table class="t"><thead><tr><th>Cliente</th><th>Plano</th><th>Conversas</th><th>Respostas</th><th>Resolução automática</th><th>Fila pendente</th><th>Base</th></tr></thead><tbody>
  ${porCli.map(x => `<tr><td><b>${esc(x.c.nome)}</b>${x.c.piloto ? ' <span class="tag warn">piloto</span>' : ''}</td><td>${tagPlano(x.c)}</td><td class="mono">${x.conv}</td><td class="mono">${x.n}</td><td>${x.n ? pct(x.taxa) : '—'}</td><td class="mono">${x.pend}</td><td class="mono">${x.base}</td></tr>`).join('')}
  </tbody></table></div>`;
}

  return `PROPOSTA — Atendimento automatizado
Cliente: ${c.nome}
Segmento: ${kit?.nome || '—'}

PLANO: ${c.plano === 'B' ? 'Opção B — Bot de respostas automáticas + IA humanizada' : 'Opção A — Bot de respostas automáticas com machine learning supervisionado'}

CANAL: Chat no seu site (balão flutuante) e link direto para divulgar nas redes.

O QUE ESTÁ INCLUSO

• Atendimento 24h para dúvidas frequentes: horários, endereço, preços, pagamento${kit?.id === 'alimentacao' ? ', cardápio e entregas' : kit?.id === 'comercio' ? ', catálogo, frete e trocas' : kit?.id === 'servicos' ? ', orçamentos, prazos e garantia' : ''}.
• Painel de atendimento para a sua equipe assumir a conversa quando o cliente pedir uma pessoa, com aviso sonoro.
• Curadoria contínua: toda semana revisamos as perguntas que o bot não soube responder e atualizamos a base.
• Relatório mensal: assuntos mais perguntados e taxa de resolução automática.

INVESTIMENTO
Implantação: ${f(P.setup)}${d ? ` (de ${brl(P.setup)})` : ''}
Mensalidade (sistema + curadoria): ${f(P.mensal)}${d ? ` (de ${brl(P.mensal)})` : ''}
${c.piloto ? `\nCondição especial de PROJETO PILOTO: ${S.ajustes.precos.descontoPiloto}% de desconto em troca de usarmos os atendimentos (anonimizados) para calibrar a base do segmento.\n` : ''}
Prazo de implantação: ${c.bd === 'criado' ? 'até 3 dias úteis' : 'até 7 dias úteis após o envio das informações'}.`;
}

function baixar(nome, obj){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function escolherArquivo(cb){ const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { toast('Arquivo inválido'); } }; r.readAsText(f); }; i.click(); }

  async excluirCliente(el){
    const c = emp(el.dataset.id);
    if (prompt(`Isso apaga ${c.nome} com toda a base, conversas, fila e acessos. Digite o endereço do chat (${c.slug}) para confirmar:`) !== c.slug) return;
    await ocupado(el, async () => {
      for (const a of S.acessos.filter(x => x.empresa_id === c.id)) { try { await smChamar(sb, 'remover_acesso', { user_id: a.user_id }); } catch (e) { console.warn(e); } }
      must(await sb.from('empresas').delete().eq('id', c.id));
      S.empresas = S.empresas.filter(x => x.id !== c.id); delete S.base[c.id]; S.fila = S.fila.filter(f => f.empresa_id !== c.id); S.acessos = S.acessos.filter(a => a.empresa_id !== c.id);
      if (ui.empresaAtiva === c.id) ui.empresaAtiva = S.empresas[0]?.id || null;
      fecharModal(); render();
    });
  },
  verAcessos(el){ modalAcessos(el.dataset.id); },
  async criarAcesso(el){
    const id = el.dataset.id, email = $('#acEmail').value.trim(), senha = $('#acSenha').value, nome = $('#acNome').value.trim();
    if (!email || senha.length < 8) return toast('Informe o e-mail e uma senha com pelo menos 8 caracteres');
    await ocupado(el, async () => { await smChamar(sb, 'criar_acesso', { empresa_id: id, email, senha, nome }); S.acessos = must(await sb.from('perfis').select('*').eq('papel', 'empresa')); modalAcessos(id); toast('Acesso criado'); });
  },
  async removerAcesso(el){ if (!confirm('Remover este acesso ao painel?')) return; await ocupado(el, async () => { await smChamar(sb, 'remover_acesso', { user_id: el.dataset.id }); S.acessos = S.acessos.filter(a => a.user_id !== el.dataset.id); modalAcessos(el.dataset.emp); }); },
  abrirAtendimento(el){ ui.empresaAtiva = el.dataset.id; ui.ultimaAnalise = null; ir('atendimento'); },
  verBase(el){ ui.baseEmpresa = el.dataset.id; ui.baseBusca = ''; ir('base'); },
  verProposta(el){ ui.propEmpresa = el.dataset.id; ir('planos'); },
  async criarExemplos(el){
    if (!confirm('Criar 3 clientes de exemplo (um por nicho) para demonstração?')) return;
    await ocupado(el, async () => {
      const demo = [
        { nome:'TecCell Assistência', slug:'teccell-demo', nicho:'servicos', plano:'A', piloto:true, tom:'cordial', cor:'#2563eb' },
        { nome:'Estilo Urbano Moda', slug:'estilo-urbano-demo', nicho:'comercio', plano:'B', piloto:true, tom:'descontraído', cor:'#db2777' },
        { nome:'Sabor da Casa Delivery', slug:'sabor-da-casa-demo', nicho:'alimentacao', plano:'A', piloto:true, tom:'descontraído', cor:'#ea580c' },
      ];
      for (const d of demo) {
        if (S.empresas.some(e => e.slug === d.slug)) continue;
        await criarEmpresa({ ...d, bd: 'criado', exemplo: true, vars: varsExemplo(d.nicho, { empresa: d.nome }) });
      }
      ui.empresaAtiva = S.empresas[0]?.id; render(); toast('Clientes de exemplo criados');
    });
  },
  async limparExemplos(el){
    if (!confirm('Remover os clientes de exemplo (com conversas, base e fila deles)?')) return;
    await ocupado(el, async () => {
      const ids = S.empresas.filter(c => c.exemplo).map(c => c.id);
      for (const a of S.acessos.filter(x => ids.includes(x.empresa_id))) { try { await smChamar(sb, 'remover_acesso', { user_id: a.user_id }); } catch (e) { console.warn(e); } }
      must(await sb.from('empresas').delete().eq('exemplo', true)); must(await sb.from('fila').delete().eq('exemplo', true)); await carregarTudo(); render(); toast('Dados de exemplo removidos'); });
  },
  /* kits */
  verKit(el){ ui.kitAberto = ui.kitAberto === el.dataset.id ? null : el.dataset.id; render(); },
  exportarKit(el){ baixar(`kit-${el.dataset.id}.json`, S.kits[el.dataset.id]); },
  async promoverKit(el){
    const c = emp($('#kitDeEmpresa').value); if (!c) return; const kit = clone(S.kits[c.nicho]); if (!kit) return toast('Cliente sem kit');
    let n = 0;
    for (const e of S.base[c.id] || []) {
      const ex = kit.entradas.find(k => k.intencao === e.intencao);
      if (ex) e.perguntas.forEach(p => { if (!ex.perguntas.some(x => norm(x) === norm(p))) { ex.perguntas.push(p); n++; } });
      else if (e.origem === 'curadoria') { kit.entradas.push({ intencao: e.intencao, categoria: e.categoria, perguntas: [...e.perguntas], resposta: e.resposta, humano: e.humano }); n++; }
    }
    if (!n) return toast('Nada novo para levar ao kit');
    await ocupado(el, async () => { must(await sb.from('kits').update({ dados: kit, atualizado_em: new Date().toISOString() }).eq('id', kit.id)); S.kits[kit.id] = kit; render(); toast(`Kit ${kit.nome} atualizado (${n} itens)`); });
  },
  async restaurarKits(el){ if (!confirm('Voltar os 3 kits ao conteúdo original? (as bases dos clientes não mudam)')) return; await ocupado(el, async () => { await instalarKits(); render(); }); },
  /* relatórios / planos */
  relPeriodo(el){ ui.relPeriodo = +el.dataset.id; render(); },
  copiarProposta(){ copiar($('#propTxt').value); },
  /* config */
  async testarIA(el){ await ocupado(el, async () => { try { ui.iaStatus = await smChamar(sb, 'testar_ia'); } catch (e) { ui.iaStatus = null; $('#iaSt').textContent = '❌ ' + e.message; return; } render(); }); },
  async exportarTudo(el){
    await ocupado(el, async () => {
      const tabelas = ['empresas','respostas','fila','kits','ajustes','conversas','mensagens'], out = { exportado_em: new Date().toISOString() };
      for (const t of tabelas) out[t] = await paginar(() => sb.from(t).select('*').order('id'));
      baixar(`suporte-multiplataforma-backup-${new Date().toISOString().slice(0, 10)}.json`, out);
    });
  },
};
const CHG = {
  filaEmpresa(v){ ui.filaEmpresa = v; render(); },
  baseEmpresa(v){ ui.baseEmpresa = v; render(); },
  relEmpresa(v){ ui.relEmpresa = v; render(); },
  propEmpresa(v){ ui.propEmpresa = v; $('#propTxt').value = textoProposta(emp(v)); },
  fcNicho(v){ const cur = {}; document.querySelectorAll('.fcVar').forEach(t => cur[t.dataset.k] = t.value); $('#fcVars').innerHTML = camposVars(v, cur); },
};
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav button[data-view]'); if (nav) { ir(nav.dataset.view); return; }
  const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) { e.preventDefault(); A[el.dataset.act](el); }
  if (e.target.id === 'modalBg') fecharModal();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.chg && CHG[el.dataset.chg]) CHG[el.dataset.chg](el.value);
  if (el.dataset.preco) {
    const [k, f] = el.dataset.preco.split('.'), v = Math.max(0, +el.value || 0), P = clone(S.ajustes.precos);
    if (f) P[k][f] = v; else P[k] = v;
    try { must(await sb.from('ajustes').update({ precos: P }).eq('id', 1)); S.ajustes.precos = P; const y = $('#view').scrollTop; render(); $('#view').scrollTop = y; } catch (err) { erro(err); }
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.inp === 'baseBusca') { ui.baseBusca = e.target.value; const pos = e.target.selectionStart; vBase(); const i = document.querySelector('[data-inp="baseBusca"]'); i.focus(); i.selectionStart = i.selectionEnd = pos; }
  if (e.target.dataset.inp === 'fcNome') { const s = $('#fcSlug'); if (s && !s.dataset.editado) s.value = slugDe(e.target.value); }
  if (e.target.id === 'fcSlug') e.target.dataset.editado = '1';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

iniciar();
</script>
</body>
</html>
