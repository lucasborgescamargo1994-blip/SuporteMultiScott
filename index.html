<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atendimento</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4f46e5; --brand-t:#ffffff;
  --bg:#eef0f6; --surface:#ffffff; --surface-2:#f2f4f9; --text:#161a2d; --muted:#5b6278; --faint:#8a90a6; --border:#e2e5ee;
  --human:#0f8f84; --human-soft:#e4f5f3; --warn-soft:#fdf3e2; --warn:#9a5b06; --err:#c62828;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1020; --surface:#161a2c; --surface-2:#1e2339; --text:#e8eaf4; --muted:#a3a9be; --faint:#7a809a; --border:#2a3150;
    --human:#2cc9b8; --human-soft:#10332f; --warn-soft:#352812; --warn:#fbbf24; --err:#f87171;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1020; --surface:#161a2c; --surface-2:#1e2339; --text:#e8eaf4; --muted:#a3a9be; --faint:#7a809a; --border:#2a3150;
  --human:#2cc9b8; --human-soft:#10332f; --warn-soft:#352812; --warn:#fbbf24; --err:#f87171;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;display:flex;align-items:center;justify-content:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.chat{width:100%;max-width:460px;height:100vh;height:100dvh;max-height:780px;background:var(--surface);display:flex;flex-direction:column;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(20,25,45,.14)}
body.embed{background:transparent}
body.embed .chat,.full .chat{max-width:none;max-height:none;border-radius:0;box-shadow:none}
@media (max-width:520px){.chat{max-width:none;max-height:none;border-radius:0;box-shadow:none}}

.hd{background:var(--brand);color:var(--brand-t);display:flex;align-items:center;gap:11px;padding:14px 14px 14px 16px;flex-shrink:0}
.hd .av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.hd .who{flex:1;min-width:0}
.hd b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.hd small i{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block}
.hd button{border:none;background:rgba(255,255,255,.16);color:var(--brand-t);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.hd button:hover{background:rgba(255,255,255,.28)}
.teste{font-size:10px;font-weight:700;background:rgba(0,0,0,.25);border-radius:6px;padding:1px 6px;margin-left:4px}

.banner{display:none;align-items:center;gap:10px;padding:9px 14px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--border);flex-shrink:0}
.banner.show{display:flex}
.banner.espera{background:var(--warn-soft);color:var(--warn)}
.banner.humano{background:var(--human-soft);color:var(--human)}
.banner.fim{background:var(--surface-2);color:var(--muted)}
.banner span{flex:1}
.banner button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}

.msgs{flex:1;overflow-y:auto;padding:18px 14px 10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.m{max-width:84%;padding:9px 13px;border-radius:15px;word-wrap:break-word;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.m.cliente{align-self:flex-end;background:var(--brand);color:var(--brand-t);border-bottom-right-radius:5px}
.m.bot,.m.atendente{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.m.atendente{border-color:var(--human);box-shadow:inset 3px 0 0 var(--human)}
.m.sistema{align-self:center;background:none;color:var(--muted);font-size:12px;text-align:center;max-width:90%;padding:2px 8px}
.m .quem{font-size:11px;font-weight:700;color:var(--human);margin-bottom:2px}
.m a{color:inherit;text-decoration:underline}
.m .rod{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;opacity:.6}
.m.cliente .rod{justify-content:flex-end}
.m .fb{display:flex;gap:2px;margin-left:auto}
.m .fb button{border:none;background:none;font-size:13px;opacity:.75;padding:0 2px;filter:grayscale(1)}
.m .fb button:hover{opacity:1;filter:none}
.m .fb .ok{font-size:11px}
.m.pendente{opacity:.65}
.m.erro{background:var(--err);color:#fff}
.sugs{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.sugs button{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:7px 10px;text-align:left;font-size:13px;font-weight:600;color:var(--brand)}
.sugs button:hover:not(:disabled){border-color:var(--brand)}
.sugs button:disabled{opacity:.55;cursor:default}
:root[data-theme="dark"] .sugs button,:root:not([data-theme="light"]) .sugs button{color:var(--text)}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--surface-2);flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chips button:hover{border-color:var(--brand);color:var(--text)}

.humano-form{display:none;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.humano-form.show{display:flex}
.humano-form b{font-size:13.5px}
.humano-form p{font-size:12px;color:var(--muted)}
.humano-form .row{display:flex;gap:8px}
.humano-form input{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 11px;outline:none;font-size:13.5px}
.humano-form input:focus{border-color:var(--brand)}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
.btn.pri{background:var(--brand);color:var(--brand-t)}
.btn.sec{background:var(--surface-2);color:var(--muted)}

.in{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.in textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--surface-2);border-radius:20px;padding:10px 15px;outline:none;max-height:120px;line-height:1.4;font-size:14.5px}
.in textarea:focus{border-color:var(--brand)}
.in button{width:42px;height:42px;border-radius:50%;border:none;background:var(--brand);color:var(--brand-t);font-size:17px;flex-shrink:0}
.in button:disabled{opacity:.5;cursor:default}
.aviso{text-align:center;font-size:10.5px;color:var(--faint);padding:0 12px 8px;background:var(--surface)}
.tela{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;padding:30px;text-align:center;color:var(--muted)}
.tela .big{font-size:40px}
.tela b{color:var(--text);font-size:16px}
</style>
</head>
<body>
<div class="chat" id="chat"><div class="tela"><div class="typing"><i></i><i></i><i></i></div><p>Carregando atendimento…</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const CFG = window.SM_CONFIG || {};
const qs = new URLSearchParams(location.search);
const SLUG = (qs.get('c') || '').trim().toLowerCase();
const TESTE = qs.get('teste') === '1';
const EMBED = qs.get('embed') === '1';
const LS_CONV = 'sm-conv-' + SLUG + (TESTE ? '-teste' : '');
if (EMBED) document.body.classList.add('embed');
if (qs.get('full') === '1') document.body.classList.add('full');

let sb, empresa = null, conversa = null, msgs = [], sugestoes = [], canal = null, aguardandoBot = false, seqTmp = 0;
const $ = s => document.querySelector(s);

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
function hora(ts){return new Date(ts || Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function tela(icone, titulo, texto){$('#chat').innerHTML = `<div class="tela"><div class="big">${icone}</div><b>${esc(titulo)}</b><p>${esc(texto)}</p></div>`}
function corTexto(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#fff';const n=parseInt(m[1],16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>160?'#161a2d':'#ffffff'}

async function iniciar(){
  if (!window.smConfigurado || !smConfigurado()) return tela('⚙️','Configuração pendente','Preencha o arquivo config.js com os dados do seu projeto Supabase.');
  if (!SLUG) return tela('🔗','Link incompleto','Este link de atendimento não indica a empresa. Confira o endereço recebido.');
  const auth = { persistSession: true, autoRefreshToken: true };
  if (!TESTE) auth.storageKey = 'sm-visitante'; // separa a sessão do visitante da sessão dos painéis
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth });
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { const { error } = await sb.auth.signInAnonymously(); if (error) throw error; }
    const r = await smChamar(sb, 'iniciar', { slug: SLUG, conversa_id: lsGet(LS_CONV) });
    empresa = r.empresa; conversa = r.conversa; msgs = r.mensagens || []; sugestoes = r.sugestoes || [];
    if (!conversa) lsSet(LS_CONV, null);
  } catch (e) {
    console.error(e);
    return tela('😕','Atendimento indisponível', /anonymous/i.test(e.message) ? 'O login anônimo não está habilitado no Supabase (Authentication → Sign In / Providers → Anonymous).' : e.message);
  }
  document.documentElement.style.setProperty('--brand', empresa.cor || '#4f46e5');
  document.documentElement.style.setProperty('--brand-t', corTexto(empresa.cor));
  document.title = empresa.nome + ' · Atendimento';
  montar(); render(); assinar();
}

function montar(){
  $('#chat').innerHTML = `
    <div class="hd">
      <span class="av">${esc(empresa.icone)}</span>
      <div class="who"><b>${esc(empresa.nome)}${TESTE ? '<span class="teste">TESTE</span>' : ''}</b><small id="st"><i></i>Assistente virtual · online</small></div>
      <button id="btnHumano" title="Falar com uma pessoa da equipe">👤 Atendente</button>
      <button id="btnNova" title="Começar uma nova conversa">↺</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="humano-form" id="hf">
      <b>Falar com a equipe</b>
      <p>Deixe seu nome e, se quiser, um WhatsApp para retorno caso ninguém esteja disponível agora.</p>
      <div class="row"><input id="hfNome" placeholder="Seu nome" maxlength="80" autocomplete="name"><input id="hfCont" placeholder="WhatsApp (opcional)" maxlength="80" autocomplete="tel"></div>
      <div class="row"><button type="button" class="btn sec" id="hfCancel">Cancelar</button><button class="btn pri" style="flex:1">Chamar atendente</button></div>
    </form>
    <form class="in" id="form"><textarea id="txt" rows="1" placeholder="Digite sua mensagem…" maxlength="1000" aria-label="Mensagem"></textarea><button id="send" title="Enviar">➤</button></form>
    <div class="aviso">Atendimento automatizado · as conversas podem ser revisadas para melhorar as respostas</div>`;
  const txt = $('#txt');
  txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 120) + 'px'; });
  txt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); } });
  $('#form').onsubmit = e => { e.preventDefault(); const v = txt.value.trim(); if (!v) return; txt.value = ''; txt.style.height = 'auto'; enviar(v); };
  $('#btnHumano').onclick = () => { $('#hf').classList.toggle('show'); if ($('#hf').classList.contains('show')) $('#hfNome').focus(); };
  $('#hfCancel').onclick = () => $('#hf').classList.remove('show');
  $('#hf').onsubmit = e => { e.preventDefault(); pedirHumano(); };
  $('#btnNova').onclick = () => { if (!msgs.length || confirm('Começar uma nova conversa?')) novaConversa(); };
  $('#msgs').addEventListener('click', cliqueMensagens);
  $('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) enviar(b.dataset.t); });
  $('#banner').addEventListener('click', e => { if (e.target.closest('button')) voltarBot(); });
  if (!EMBED) txt.focus();
}

function render(){
  const box = $('#msgs'); if (!box) return;
  const ultimoBot = [...msgs].reverse().find(m => m.autor !== 'sistema');
  let h = `<div class="m bot">${fmt(empresa.saudacao)}</div>`;
  for (const m of msgs) {
    if (m.autor === 'sistema') { h += `<div class="m sistema">${fmt(m.texto)}</div>`; continue; }
    const cls = 'm ' + m.autor + (m.pendente ? ' pendente' : '') + (m.erro ? ' erro' : '');
    let extra = '';
    if (m.autor === 'atendente') extra = `<div class="quem">👤 ${esc(m.autor_nome || 'Atendente')}</div>`;
    let sug = '';
    if (m.autor === 'bot' && m.meta?.sugestoes?.length) {
      const ativa = m === ultimoBot && (conversa?.status || 'bot') === 'bot';
      sug = `<div class="sugs">${m.meta.sugestoes.map(s => `<button ${ativa ? `data-sug="${esc(s.id)}" data-t="${esc(s.txt)}"` : 'disabled'}>${esc(s.txt)}</button>`).join('')}</div>`;
    }
    let fb = '';
    if (m.autor === 'bot' && m.resultado && m.resultado !== 'saudacao' && typeof m.id === 'number')
      fb = `<span class="fb">${m.feedback ? `<span class="ok">${m.feedback === 'pos' ? '👍 obrigado!' : '👎 vamos melhorar'}</span>` : `<button data-fb="pos" data-id="${m.id}" title="Ajudou">👍</button><button data-fb="neg" data-id="${m.id}" title="Não ajudou">👎</button>`}</span>`;
    h += `<div class="${cls}">${extra}${fmt(m.texto)}${sug}<div class="rod"><span>${m.erro ? 'não enviada' : hora(m.criado_em)}</span>${fb}</div></div>`;
  }
  if (aguardandoBot) h += `<div class="m bot"><span class="typing"><i></i><i></i><i></i></span></div>`;
  box.innerHTML = h;
  box.scrollTop = box.scrollHeight;
  // atalhos: só no começo da conversa
  const chips = $('#chips');
  chips.style.display = !msgs.some(m => m.autor === 'cliente') && sugestoes.length ? '' : 'none';
  chips.innerHTML = sugestoes.map(s => `<button data-t="${esc(s)}">${esc(s)}</button>`).join('');
  renderStatus();
}

function renderStatus(){
  const st = conversa?.status || 'bot', ban = $('#banner'); if (!ban) return;
  ban.className = 'banner';
  if (st === 'aguardando_humano') { ban.classList.add('show','espera'); ban.innerHTML = `<span>⏳ Aguardando um atendente. Pode continuar escrevendo — a equipe verá tudo.</span><button>Voltar ao assistente</button>`; }
  else if (st === 'humano') { ban.classList.add('show','humano'); ban.innerHTML = `<span>👤 Você está falando com ${esc(conversa.atendente_nome || 'a equipe')}</span>`; }
  else if (st === 'encerrada') { ban.classList.add('show','fim'); ban.innerHTML = `<span>Atendimento encerrado. Se precisar, é só mandar outra mensagem.</span>`; }
  const s = $('#st');
  if (s) s.innerHTML = st === 'humano' ? `<i></i>Atendimento humano` : st === 'aguardando_humano' ? `<i style="background:#fbbf24"></i>Chamando a equipe…` : `<i></i>Assistente virtual · online`;
  const bh = $('#btnHumano'); if (bh) bh.style.display = st === 'bot' || st === 'encerrada' ? '' : 'none';
}

function adicionar(lista){
  for (const m of lista || []) {
    if (!m || msgs.some(x => x.id === m.id)) continue;
    // a mensagem do cliente pode chegar pelo tempo real antes da resposta da função: troca a provisória
    if (m.autor === 'cliente') { const i = msgs.findIndex(x => x.pendente && x.texto === m.texto); if (i >= 0) msgs.splice(i, 1); }
    msgs.push(m);
  }
  msgs.sort((a, b) => (typeof a.id === 'number' ? a.id : 1e15) - (typeof b.id === 'number' ? b.id : 1e15));
}
function aplicarResposta(r){
  if (r.conversa) {
    const nova = !conversa || conversa.id !== r.conversa.id;
    conversa = { ...(conversa || {}), ...r.conversa };
    lsSet(LS_CONV, conversa.id);
    if (nova) assinar();
  }
  adicionar(r.mensagens);
  if (TESTE && r.analise && window.parent !== window) window.parent.postMessage({ tipo: 'sm-analise', analise: r.analise }, '*');
}

async function enviar(texto, extra){
  if (aguardandoBot) return;
  const tmp = { id: 'tmp' + (++seqTmp), autor: 'cliente', texto, pendente: true, criado_em: new Date().toISOString() };
  msgs.push(tmp);
  aguardandoBot = !conversa || conversa.status === 'bot' || conversa.status === 'encerrada';
  render();
  try {
    const r = await smChamar(sb, 'mensagem', { slug: SLUG, conversa_id: conversa?.id, texto, teste: TESTE, ...(extra || {}) });
    msgs = msgs.filter(m => m !== tmp);
    aplicarResposta(r);
  } catch (e) {
    tmp.pendente = false; tmp.erro = true;
    msgs.push({ id: 'tmp' + (++seqTmp), autor: 'sistema', texto: '⚠️ ' + e.message });
  }
  aguardandoBot = false; render();
}

async function cliqueMensagens(e){
  const s = e.target.closest('[data-sug]');
  if (s) {
    const ultimaPergunta = [...msgs].reverse().find(m => m.autor === 'cliente' && !m.erro);
    return enviar(s.dataset.t, { resposta_id: s.dataset.sug, original: ultimaPergunta?.texto || '' });
  }
  const f = e.target.closest('[data-fb]');
  if (f) {
    const m = msgs.find(x => x.id === Number(f.dataset.id)); if (!m) return;
    m.feedback = f.dataset.fb; render();
    try { await smChamar(sb, 'feedback', { mensagem_id: m.id, valor: m.feedback }); } catch (err) { m.feedback = null; render(); }
  }
}

async function pedirHumano(){
  const btn = $('#hf .btn.pri'); btn.disabled = true;
  try {
    const r = await smChamar(sb, 'pedir_humano', { slug: SLUG, conversa_id: conversa?.id, nome: $('#hfNome').value, contato: $('#hfCont').value, teste: TESTE });
    aplicarResposta(r); $('#hf').classList.remove('show');
  } catch (e) { alert(e.message); }
  btn.disabled = false; render();
}
async function voltarBot(){
  try { aplicarResposta(await smChamar(sb, 'voltar_bot', { slug: SLUG, conversa_id: conversa?.id })); render(); } catch (e) { alert(e.message); }
}
function novaConversa(){
  if (canal) { sb.removeChannel(canal); canal = null; }
  conversa = null; msgs = []; lsSet(LS_CONV, null); render();
}

// Tempo real: resposta do atendente e mudança de status chegam sem recarregar
function assinar(){
  if (!conversa || !sb) return;
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('conv-' + conversa.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens', filter: 'conversa_id=eq.' + conversa.id }, p => { adicionar([p.new]); render(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'conversas', filter: 'id=eq.' + conversa.id }, p => {
      conversa = { ...conversa, status: p.new.status, atendente_nome: p.new.atendente_nome }; render();
    })
    .subscribe();
}

window.addEventListener('message', e => { if (e.data?.tipo === 'sm-nova' && sb) novaConversa(); });
iniciar();
</script>
</body>
</html>
